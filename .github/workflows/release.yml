name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --locked
      - name: Smoke test (sem teclado, 2 s)
        run: .\target\release\gmk104-aura.exe --no-tray --duration 2
      - uses: actions/upload-artifact@v4
        with:
          name: gmk104-aura-windows-x64
          path: target/release/gmk104-aura.exe
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/gmk104-aura.exe
          generate_release_notes: true
